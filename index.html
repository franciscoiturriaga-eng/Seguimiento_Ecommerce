<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div id="pantallaLogin" class="min-h-screen flex items-center justify-center bg-slate-100">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 max-w-md w-full text-center">
            <h1 class="text-3xl font-extrabold text-blue-600 mb-2">Control de Proyectos</h1>
            <p class="text-slate-500 mb-8">Inicia sesión con el correo de tu empresa para acceder.</p>
            <button id="btnLogin" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.133 1 1.18 5.925 1.18 12s4.953 11 11.06 11c6.373 0 10.596-4.414 10.596-10.77 0-.725-.078-1.282-.175-1.945H12.24z"/></svg>
                Iniciar Sesión con Google
            </button>
            <p id="errorLogin" class="text-red-500 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <div id="plataforma" class="hidden p-8 max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">Control de Iniciativas</h1>
                <p id="txtUsuario" class="text-slate-500 text-sm">Cargando usuario...</p>
            </div>
            <div class="flex gap-4">
                <button id="btnLogout" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg hover:bg-slate-200 transition text-sm font-medium">Cerrar Sesión</button>
                <button id="btnAbrirModal" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium">+ Nueva Iniciativa</button>
            </div>
        </header>

        <div id="txtCargando" class="text-center py-8 text-slate-500 font-medium">Cargando datos desde Google Sheets...</div>

        <div id="contenedorGraficas" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-4 text-slate-700">Iniciativas por Estado</h2>
                <canvas id="graficaEstados"></canvas>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-4 text-slate-700">Proyectos por Tema</h2>
                <canvas id="graficaTemas"></canvas>
            </div>
        </div>
    </div>

    <div id="modalFormulario" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Agregar Nueva Iniciativa</h2>
            <form id="formIniciativa" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Nombre de la Iniciativa</label>
                    <input type="text" id="inputIniciativa" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Responsable</label>
                    <input type="text" id="inputResponsable" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Estado</label>
                    <select id="selectEstado" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                        <option value="Backlog">Backlog</option>
                        <option value="En Progreso">En Progreso</option>
                        <option value="Bloqueado">Bloqueado</option>
                        <option value="Finalizado">Finalizado</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Tema / Área</label>
                    <select id="selectTema" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                        <option value="Marketing">Marketing</option>
                        <option value="Tecnología">Tecnología</option>
                        <option value="Operaciones">Operaciones</option>
                        <option value="RRHH">RRHH</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="btnCerrarModal" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg hover:bg-slate-200 transition text-sm font-medium">Cancelar</button>
                    <button type="submit" id="btnGuardar" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium">Guardar Proyecto</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // URL DE TU GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVXDEBW-nGCiWRzbUTtuXQBMP3wbgluz3ZxMmNpn3RSEksBlr6m7g70Lu2QikBOJS0/exec";

        // ⚠️ COLOCA AQUÍ TUS CREDENCIALES DE FIREBASE
       const firebaseConfig = {
  apiKey: "AIzaSyCDSwIRvDp2ltDNDUlx0l17B6gdI0O1oFk",
  authDomain: "control-proyectos-33bfb.firebaseapp.com",
  projectId: "control-proyectos-33bfb",
  storageBucket: "control-proyectos-33bfb.firebasestorage.app",
  messagingSenderId: "614616026781",
  appId: "1:614616026781:web:caaf274a8afbcb23080e74"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const domLogin = document.getElementById('pantallaLogin');
        const domPlataforma = document.getElementById('plataforma');
        const txtUsuario = document.getElementById('txtUsuario');
        const errorLogin = document.getElementById('errorLogin');
        const modalFormulario = document.getElementById('modalFormulario');

        let chartEstados = null;
        let chartTemas = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // FILTRO DE SEGURIDAD
                if (user.email.endsWith('@hites.cl') || user.email === 'francisco.iturriaga@hites.cl') {
                    domLogin.classList.add('hidden');
                    domPlataforma.classList.remove('hidden');
                    txtUsuario.innerText = `Conectado como: ${user.displayName} (${user.email})`;
                    cargarDatosDesdeSheets();
                } else {
                    signOut(auth);
                    errorLogin.innerText = "Acceso denegado. Solo correos corporativos.";
                    errorLogin.classList.remove('hidden');
                }
            } else {
                domLogin.classList.remove('hidden');
                domPlataforma.classList.add('hidden');
            }
        });

        // Cargar datos reales del Excel
        function cargarDatosDesdeSheets() {
            document.getElementById('txtCargando').classList.remove('hidden');
            document.getElementById('contenedorGraficas').classList.add('hidden');

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('txtCargando').classList.add('hidden');
                    document.getElementById('contenedorGraficas').classList.remove('hidden');
                    procesarYRenderizarGraficas(data);
                })
                .catch(err => {
                    document.getElementById('txtCargando').innerText = "Error al conectar con Google Sheets.";
                    console.error(err);
                });
        }

        function procesarYRenderizarGraficas(proyectos) {
            // Contadores base
            const estados = { 'Backlog': 0, 'En Progreso': 0, 'Bloqueado': 0, 'Finalizado': 0 };
            const temas = { 'Marketing': 0, 'Tecnología': 0, 'Operaciones': 0, 'RRHH': 0 };

            proyectos.forEach(p => {
                if(estados[p.estado] !== undefined) estados[p.estado]++;
                if(temas[p.tema] !== undefined) temas[p.tema]++;
            });

            // Si las gráficas ya existían, las destruimos para redibujar con los nuevos datos
            if(chartEstados) chartEstados.destroy();
            if(chartTemas) chartTemas.destroy();

            const ctxEstados = document.getElementById('graficaEstados');
            chartEstados = new Chart(ctxEstados, {
                type: 'bar',
                data: {
                    labels: Object.keys(estados),
                    datasets: [{ label: 'Cantidad', data: Object.values(estados), backgroundColor: '#3b82f6', borderRadius: 4 }]
                },
                options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            const ctxTemas = document.getElementById('graficaTemas');
            chartTemas = new Chart(ctxTemas, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(temas),
                    datasets: [{ data: Object.values(temas), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'] }]
                }
            });
        }

        // LÓGICA DEL FORMULARIO MODAL
        document.getElementById('btnAbrirModal').addEventListener('click', () => modalFormulario.classList.remove('hidden'));
        document.getElementById('btnCerrarModal').addEventListener('click', () => modalFormulario.classList.add('hidden'));

        document.getElementById('formIniciativa').addEventListener('submit', (e) => {
            e.preventDefault();
            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.innerText = "Guardando...";
            btnGuardar.disabled = true;

            const nuevoProyecto = {
                iniciativa: document.getElementById('inputIniciativa').value,
                responsable: document.getElementById('inputResponsable').value,
                estado: document.getElementById('selectEstado').value,
                tema: document.getElementById('selectTema').value
            };

            // Enviar datos al Apps Script por POST
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Requerido para evitar problemas de CORS cruzado con Google Apps Script
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nuevoProyecto)
            }).then(() => {
                // Como usamos no-cors, asumimos éxito rápido
                modalFormulario.classList.add('hidden');
                document.getElementById('formIniciativa').reset();
                btnGuardar.innerText = "Guardar Proyecto";
                btnGuardar.disabled = false;
                
                // Recargar el dashboard para ver el impacto inmediatamente
                setTimeout(cargarDatosDesdeSheets, 1500);
            }).catch(err => {
                alert("Error al guardar.");
                btnGuardar.innerText = "Guardar Proyecto";
                btnGuardar.disabled = false;
            });
        });

        // LOGIN / LOGOUT
        document.getElementById('btnLogin').addEventListener('click', () => {
            errorLogin.classList.add('hidden');
            signInWithPopup(auth, provider).catch(() => {
                errorLogin.innerText = "Error al autenticar.";
                errorLogin.classList.remove('hidden');
            });
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
